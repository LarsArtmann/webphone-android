org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Build cache (J13/M043): task outputs survive clean builds and forced
# re-runs (the verify-gate's --rerun paths). Incremental up-to-date
# checks stay the first line; this is the second (Gradle-native, no
# third-party plugin, no CI cache action needed to pay locally).
org.gradle.caching=true
