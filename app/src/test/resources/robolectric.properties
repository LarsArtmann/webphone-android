# The ONE Robolectric policy for this suite (J16/M053): every
# Robolectric test runs against SDK 34 with the PLAIN Application —
# never the manifest's App, whose onCreate initializes WebRTC's
# native factory (UnsatisfiedLinkError on the JVM). This file replaces
# the eleven per-class @Config(sdk=[34], application=...) annotations;
# a test class that needs something different must say so loudly in
# its own @Config, never silently inherit default.
sdk=34
application=android.app.Application
