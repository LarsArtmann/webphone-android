name: CI

# The execution home is GitHub Actions (decision 2026-10-25): the
# workflow already lives on the GitHub mirror, and a Forgejo-native
# runner would be new infra for the same signal. The mirror's PAT
# cannot push workflow-file changes (the `workflow` scope gap) —
# pushes touching this directory go by hand over SSH until the PAT is
# re-scoped.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Fleet policy (cue-policy #CIWorkflow): CI never publishes — least
# privilege is a plain contents:read, anything wider must be explicit.
permissions:
  contents: read

jobs:
  verify:
    name: Build, test, align, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Unit tests (protocol + wiring)
        run: ./gradlew testDebugUnitTest

      # Kotlin style gate (official style, .editorconfig). Failure
      # blocks merge; `./gradlew ktlintFormat` fixes mechanically.
      - name: Kotlin style gate (ktlint)
        run: ./gradlew ktlintCheck

      # The built-in-Kotlin pin (buildscript classpath) and the catalog
      # `kotlin` version are one version by hand-rule; this task turns
      # silent drift into a red build with the fix in the message.
      - name: KGP-pin parity gate
        run: ./gradlew kgpParityCheck

      # The 16 KB page-size gate: build-tools 36's zipalign carries
      # -P 16 (the Android 16 constraint — non-negotiable per release;
      # 36.0.0 is AGP 9's floor).
      - name: 16 KB page-alignment gate
        run: '"$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk'

      # WCAG contrast guard over the color-token pairs (the 2.44:1
      # answer-button class can never drift back silently). Stdlib
      # python3, no setup needed.
      - name: Contrast gate (WCAG token pairs)
        run: python3 scripts/contrast-check.py

      # R8 + resource shrinking exercised on every push (J08/M030):
      # keep-rule breakage surfaces here, not at the next release cut.
      # No signing secrets in CI — an unsigned release still builds by
      # design (see app/build.gradle.kts).
      - name: Build release APK (R8, unsigned)
        run: ./gradlew assembleRelease

      # The release APK carries the SAME 16 KB constraint — verify it,
      # not only the debug artifact.
      - name: 16 KB page-alignment gate (release)
        run: '"$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk'

      # Keep the retrace map: without it a crash stack from the
      # minified release is unreadable (J08/M031).
      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Formatting gate (dprint)
        run: npx --yes dprint@0.64.3 check
