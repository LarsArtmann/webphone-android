name: CI

# The execution home is GitHub Actions (decision 2026-10-25): the
# workflow already lives on the GitHub mirror, and a Forgejo-native
# runner would be new infra for the same signal. The mirror's PAT
# cannot push workflow-file changes (the `workflow` scope gap) —
# pushes touching this directory go by hand over SSH until the PAT is
# re-scoped.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Build, test, align, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Unit tests (protocol + wiring)
        run: ./gradlew testDebugUnitTest

      # The 16 KB page-size gate: build-tools 35's zipalign carries
      # -P 16 (the Android 16 constraint — non-negotiable per release).
      - name: 16 KB page-alignment gate
        run: '"$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk'

      - name: Formatting gate (dprint)
        run: npx --yes dprint@0.64.3 check
